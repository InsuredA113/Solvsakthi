name: Solv-In validation

on:
  pull_request:
    paths:
      - "solv-in/backend/**"
      - "solv-in/frontend/**"
      - ".github/workflows/solv-in-validation.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "solv-in/backend/**"
      - "solv-in/frontend/**"
      - ".github/workflows/solv-in-validation.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solv-in/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solv-in/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: PYTHONPATH=. pytest -q

  frontend-build:
    name: Angular production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solv-in/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
