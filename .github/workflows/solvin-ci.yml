name: Solv-In CI

on:
  push:
    branches:
      - feature/phase-3a-1-tenant-foundation
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solv-in/backend
    env:
      JWT_SECRET_KEY: ci-only-secret-key-for-solvin-tests-32-characters-minimum
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: solvin_claims_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solv-in/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solv-in/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Build Angular application
        run: npm run build
